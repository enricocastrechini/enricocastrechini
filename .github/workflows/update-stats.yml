name: Update GitHub analytics snapshots

on:
  push:
    paths-ignore:
      - 'assets/github-analytics/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-analytics-${{ github.ref }}
  cancel-in-progress: false

env:
  USERNAME: enricocastrechini

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub stats overview
        uses: lowlighter/metrics@latest
        with:
          filename: assets/github-analytics/overview.svg
          token: ${{ secrets.PAT_1 || github.token }}
          user: ${{ env.USERNAME }}
          base: header, activity, community, repositories, metadata
          config_timezone: UTC
          plugins_errors_fatal: yes
          output_action: none

      - name: Generate GitHub streak snapshot
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          path: assets/github-analytics/streak.svg
          token: ${{ secrets.PAT_1 || github.token }}
          options: >-
            ?user=enricocastrechini&theme=tokyonight&hide_border=true&date_format=j%20M%5B%20Y%5D

      - name: Generate top languages snapshot
        uses: lowlighter/metrics@latest
        with:
          filename: assets/github-analytics/languages.svg
          token: ${{ secrets.PAT_1 || github.token }}
          user: ${{ env.USERNAME }}
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_details: bytes-size, percentage
          plugins_errors_fatal: yes
          output_action: none

      - name: Generate contribution activity calendar
        uses: lowlighter/metrics@latest
        with:
          filename: assets/github-analytics/activity.svg
          token: ${{ secrets.PAT_1 || github.token }}
          user: ${{ env.USERNAME }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: UTC
          plugins_errors_fatal: yes
          output_action: none

      - name: Commit refreshed analytics assets
        run: |
          if git diff --quiet -- assets/github-analytics; then
            echo 'No analytics changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-analytics/*.svg
          git commit -m 'Update GitHub analytics snapshots [skip ci]'
          git push
