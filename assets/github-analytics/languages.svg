<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title>GitHub analytics snapshot for enricocastrechini</title>
<desc>Static snapshot generated from public GitHub profile data and refreshed by workflow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1a1b27"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>
</defs>
<rect width="100%" height="100%" rx="18" fill="url(#bg)"/>
<text x="24" y="34" fill="#c0caf5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Top Languages Snapshot</text>
<text x="24" y="58" fill="#565f89" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Current public repository language mix visible from GitHub</text>
<text x="24" y="96" fill="#c0caf5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Markdown</text>
<text x="576" y="96" fill="#565f89" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end">50% • 1 repo</text>
<rect x="24" y="110" width="552" height="16" rx="8" fill="#24283b"/>
<rect x="24" y="110" width="276.0" height="16" rx="8" fill="#7aa2f7"/>
<text x="24" y="152" fill="#c0caf5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Jupyter Notebook</text>
<text x="576" y="152" fill="#565f89" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end">50% • 1 repo</text>
<rect x="24" y="166" width="552" height="16" rx="8" fill="#24283b"/>
<rect x="24" y="166" width="276.0" height="16" rx="8" fill="#bb9af7"/>
<text x="24" y="370" fill="#565f89" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">Initial committed fallback snapshot; workflow-generated cards will become richer after approval.</text>
</svg>